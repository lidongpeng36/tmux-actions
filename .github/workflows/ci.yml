name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libevent-dev libncurses-dev pkg-config less
      - if: runner.os == 'Linux'
        run: bash scripts/ci-tmux.sh
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: python3 tests/installer.py && python3 tests/cold_install_lifecycle.py && python3 tests/actions.py && python3 tests/keys.py && python3 tests/sidebar.py
