[package]
name = "tmux-actions"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native tmux search and Rust open and sidebar actions"
license = "MIT"
repository = "https://github.com/lidongpeng36/tmux-actions"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
url = "2"
walkdir = "2"
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true
